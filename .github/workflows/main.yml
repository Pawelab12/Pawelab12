name: Postman API Tests

on:
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh

      - name: Login to Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run PostAir Weather API tests
        run: >
          postman collection run 56790794-91c4b78d-2ef5-48d5-9959-f89d9197dc07
          --env-var "baseUrl=https://education.postmanlabs.com/v1/weather"
          --env-var "apiKey=1234"
